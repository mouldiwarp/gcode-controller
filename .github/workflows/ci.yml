# Runs the tests on every push to main and every pull request. A run that never got a macOS runner
# (GitHub's free macOS capacity runs short) is re-run by retry.yml; a failing test is not.
name: CI
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']

# A newer push to the same branch supersedes an older run, so the queue for macOS runners stays short.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path swift
      # If the test process crashes, keep macOS's crash report (it has the stack) with the run.
      # The tests run inside swiftpm-testing-helper, so that's the name on the report. macOS writes
      # it a little after the crash: wait up to a minute, and print the crashed thread into the log.
      - name: Collect crash reports
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/crashes"
          for i in $(seq 30); do
            find ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports \
              \( -name 'swiftpm-testing-helper*' -o -name '*PackageTests*' -o -name 'xctest*' \) -mmin -30 \
              -exec cp {} "$RUNNER_TEMP/crashes/" \; 2>/dev/null || true
            [ -n "$(ls -A "$RUNNER_TEMP/crashes")" ] && break
            sleep 2
          done
          ls -l "$RUNNER_TEMP/crashes"
          for f in "$RUNNER_TEMP"/crashes/*.ips; do
            [ -e "$f" ] || continue
            python3 scripts/crash-stack.py "$f" || head -c 20000 "$f"
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: crash-reports
          path: ${{ runner.temp }}/crashes
          if-no-files-found: ignore
